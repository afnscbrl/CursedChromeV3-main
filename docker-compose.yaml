services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_PASSWORD: cursedchrome
      POSTGRES_USER: cursedchrome
      POSTGRES_DB: cursedchrome
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cursedchrome"]
      interval: 5s
      timeout: 5s
      retries: 10

  cursedchrome:
    build:
      context: .
      network: host
    restart: on-failure
    volumes:
      - ./ssl:/work/cassl
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_NAME: cursedchrome
      DATABASE_USER: cursedchrome
      DATABASE_PASSWORD: cursedchrome
      DATABASE_HOST: db
      BCRYPT_ROUNDS: 10
    ports:
      - "0.0.0.0:8080:8080"  # HTTP proxy
      - "0.0.0.0:4343:4343"  # WebSocket (browser implants)
      - "127.0.0.1:8118:8118"  # Admin panel
