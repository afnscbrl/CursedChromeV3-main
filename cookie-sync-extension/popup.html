<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CursedChrome Cookie Sync</title>
<style>
  :root {
    --bg: #1a1d27;
    --border: #2d3148;
    --accent: #6c63ff;
    --danger: #e05252;
    --success: #3ecf8e;
    --warn: #f5a623;
    --text: #e0e0e0;
    --muted: #777;
    --input-bg: #111420;
    --radius: 5px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html {
    min-width: 320px;
    background: var(--bg);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
    background: var(--bg);
    color: var(--text);
    width: 320px;
    padding: 1rem;
  }
  h2 { font-size: 14px; margin-bottom: 0.75rem; color: var(--accent); }
  .form-group { margin-bottom: 0.65rem; }
  label { display: block; margin-bottom: 0.2rem; font-size: 11px; color: var(--muted); }
  input {
    width: 100%;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    padding: 0.4rem 0.6rem;
    font-size: 12px;
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  .btn {
    display: block;
    width: 100%;
    padding: 0.45rem;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    margin-top: 0.5rem;
    transition: filter .15s;
  }
  .btn:hover { filter: brightness(1.15); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-secondary { background: #2d3148; color: var(--text); }
  .status {
    margin-top: 0.75rem;
    padding: 0.4rem 0.6rem;
    border-radius: var(--radius);
    font-size: 11px;
    display: none;
  }
  .status.ok   { background: rgba(62,207,142,.12); color: var(--success); border: 1px solid rgba(62,207,142,.25); }
  .status.err  { background: rgba(224,82,82,.12);  color: var(--danger);  border: 1px solid rgba(224,82,82,.25); }
  .status.warn { background: rgba(245,166,35,.1);  color: var(--warn);    border: 1px solid rgba(245,166,35,.25); }
  hr { border: none; border-top: 1px solid var(--border); margin: 0.75rem 0; }
  .hint { font-size: 10px; color: var(--muted); margin-top: 0.35rem; line-height: 1.4; }
</style>
</head>
<body>
<h2>Cookie Sync</h2>

<div class="form-group">
  <label>Server URL</label>
  <input type="text" id="url" placeholder="https://your-server.com">
  <div class="hint">The URL of your CursedChrome server (must start with http:// or https://).</div>
</div>
<div class="form-group">
  <label>Bot Username</label>
  <input type="text" id="username" placeholder="botuser...">
</div>
<div class="form-group">
  <label>Bot Password</label>
  <input type="password" id="password" placeholder="••••••••">
</div>

<button class="btn btn-secondary" id="save-btn">Save Credentials</button>

<hr>

<button class="btn btn-primary" id="sync-btn" disabled>Import Cookies + LocalStorage</button>

<div class="status" id="status"></div>

<script src="popup.js"></script>
</body>
</html>
